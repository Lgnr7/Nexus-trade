<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci pour votre commande · Ronron</title><link rel="stylesheet" href="/legal.css">
<style>.big{font:800 clamp(28px,4vw,36px)/1.1 system-ui,sans-serif;margin:8px 0}</style></head>
<body><header><a class="logo" href="/">ronron</a><a href="/">← Retour à la boutique</a></header>
<main>
  <h1 id="t">Merci !</h1>
  <div class="box" id="box"><p>Nous vérifions votre paiement…</p></div>
  <p class="muted">Un e-mail de confirmation vous est envoyé, puis un second avec le numéro de suivi dès l'expédition. Une question ? Répondez simplement à l'e-mail de confirmation.</p>
</main>
<script>
(async () => {
  // La commande est payée : on vide le panier conservé dans le navigateur.
  try { localStorage.setItem('ronron:cart', '[]'); } catch {}
  const id = new URLSearchParams(location.search).get('session_id');
  const box = document.getElementById('box');
  if (!id) { box.innerHTML = '<p>Commande introuvable. Si vous avez payé, vérifiez vos e-mails.</p>'; return; }
  try {
    const r = await fetch('/api/order/' + encodeURIComponent(id));
    const o = await r.json();
    if (!r.ok) throw new Error(o.error);
    const total = (o.total / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    if (o.paid) {
      box.innerHTML = '<p class="muted">Commande n° ' + o.reference + '</p><p class="big">' + total + ' — paiement confirmé</p><p>Confirmation envoyée à <b></b>.</p>';
      box.querySelector('b').textContent = o.email || 'votre adresse e-mail';
    } else {
      box.innerHTML = '<p>Votre paiement est en cours de validation. Vous recevrez un e-mail dès qu\'il sera confirmé.</p>';
    }
  } catch {
    box.innerHTML = '<p>Impossible d\'afficher le récapitulatif pour le moment, mais si le paiement a abouti vous recevrez un e-mail de confirmation.</p>';
  }
})();
</script>
</body></html>
