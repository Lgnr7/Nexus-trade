services:
  - type: web
    name: nexus-trade
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Garde-fou : aucun ordre réel ne part tant que ce n'est pas "true",
      # quoi que demande l'interface.
      - key: ALLOW_LIVE_TRADING
        value: "false"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: KRAKEN_KEY
        sync: false
      - key: KRAKEN_SECRET
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: SOLANA_RPC
        sync: false
      - key: SMART_WALLETS
        sync: false
      - key: DEV_BLACKLIST
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false

  # Boutique Ronron : service séparé, dossier ronron/.
  - type: web
    name: ronron
    runtime: node
    plan: free
    rootDir: ronron
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHOP_OWNER
        sync: false
      - key: SHOP_ADDRESS
        sync: false
      - key: SHOP_SIRET
        sync: false
      - key: SHOP_EMAIL
        sync: false
      - key: SHOP_MEDIATOR
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# PERSISTANCE
#
# Render ne propose de disque persistant qu'à partir des plans payants. En free
# tier, le système de fichiers est éphémère : les positions, l'historique et les
# réglages repartent à zéro à chaque redéploiement et à chaque réveil après
# mise en veille.
#
# Dès que tu passes sur un plan payant, remplace `plan: free` par `plan: starter`
# et décommente ce bloc + la variable DATA_DIR :
#
#     - key: DATA_DIR
#       value: /var/data/nexus
#
#   disk:
#     name: nexus-data
#     mountPath: /var/data
#     sizeGB: 1
# ─────────────────────────────────────────────────────────────────────────────
