services:
  - type: web
    name: nexus-trade
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data/nexus
      - key: ALLOW_LIVE_TRADING
        value: "false"
      - key: KRAKEN_KEY
        sync: false
      - key: KRAKEN_SECRET
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: SOLANA_RPC
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
    disk:
      name: nexus-data
      mountPath: /var/data
      sizeGB: 1
